[package]
name = "seerdb"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["seerdb contributors"]
description = "High-performance out-of-place B-tree storage engine for NVMe SSDs"
repository = "https://github.com/omendb/seerdb"
readme = "README.md"
keywords = ["database", "btree", "storage", "nvme", "embedded"]
categories = ["database-implementations", "data-structures"]

[dependencies]
thiserror = "2.0"
bytes = "1.9"
crc32c = "0.6"
lz4_flex = "0.11"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
tempfile = "3.14"
rand = "0.8"

[features]
default = []
# ZNS SSD support (Linux only)
zns = []
# FDP placement hints (Linux only)
fdp = []
# io_uring async I/O (Linux only)
io-uring = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true
