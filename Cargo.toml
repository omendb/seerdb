[package]
name = "seerdb"
version = "0.1.0"
edition = "2021"
license = "Elastic-2.0"
authors = ["seerdb contributors"]
description = "Research-grade storage engine with learned data structures"
repository = "https://github.com/omendb/seerdb"

[dependencies]
# Core dependencies
thiserror = "2.0"
bytes = "1.9"

# Async I/O (tokio default, secure)
tokio = { version = "1.41", features = ["full"] }

# WAL and data integrity
crc32fast = "1.4"

# Memtable (concurrent skiplist)
crossbeam-skiplist = "0.1"

# ML for learned bloom filters (prototype phase)
smartcore = "0.3"  # Decision trees, good performance
rand = "0.8"

# Hashing for traditional bloom filters
twox-hash = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.6"
tempfile = "3.14"

# Baseline systems for benchmarking
rocksdb = "0.22"
sled = "0.34"
fjall = "2.3"

[features]
default = []
# Note: io_uring support can be added later as opt-in (security concerns)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
